name: glpi

services:
  glpi:
    image: "glpi/glpi:latest"
    restart: "unless-stopped"
    container_name: glpi
    hostname: glpi
    volumes:
      - data:/var/glpi
    env_file: .env
    depends_on:
      - mariadb
    ports:
      - "8080:80"

  web-proxy:
    image: nginx:alpine
    restart: "unless-stopped"
    container_name: web-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      - glpi

  mariadb:
    image: "mariadb:lts-ubi10"
    restart: "unless-stopped"
    container_name: mariadb
    hostname: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${GLPI_DB_NAME}
      MARIADB_USER: ${GLPI_DB_USER}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD}

volumes:
  data:
  mariadb_data:

